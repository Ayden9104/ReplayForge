name = "replayforge-share"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Set after first deploy, e.g. https://replayforge-share.<account>.workers.dev
[vars]
PUBLIC_BASE_URL = "https://replayforge-share.holdup6699.workers.dev"
R2_BUCKET_NAME = "replayforge-clips"

[[r2_buckets]]
binding = "CLIPS"
bucket_name = "replayforge-clips"
preview_bucket_name = "replayforge-clips"

# Secrets (set with wrangler secret put):
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   R2_ACCOUNT_ID
